name: Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --accept 200,403,429 "./**/*.html" "./README.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
