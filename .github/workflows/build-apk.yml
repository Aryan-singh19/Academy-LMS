name: Android CI

# Builds the APK on every push / PR so breakage is caught early.
# Publishing to GitHub Releases is handled by release.yml (on version tags).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle offline copy of the site into the app
        working-directory: ${{ github.workspace }}
        run: node scripts/bundle-android-site.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academy-LMS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
