name: Build Android APK and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ../Academy-LMS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academy-LMS-apk
          path: Academy-LMS.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "Academy LMS v1.0.0 (Android APK)"
          body: |
            ### Academy LMS Android Release v1.0.0
            - Download `Academy-LMS.apk` to install on any Android device.
            - Direct Google authentication & Neon database cloud sync.
            - Study desk, practice tests, lecture notes, and discussions.
          files: Academy-LMS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
