name: Android CI

# Builds the APK on every push / PR so breakage is caught early.
# Publishing to GitHub Releases is handled by release.yml (on version tags).
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Academy-LMS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
