# Checks that every topic has a YouTube lecture (scripts/lectures/found.json). Optionally, with an API
# key, also runs the YouTube Data API fetcher and commits its separate results
# (scripts/lectures/api-results.js, REPORT-api.md) to the feature branch, never to main.
#
# The optional fetch needs the repository secret YOUTUBE_API_KEY (or YOUTUBE_API_KEYS: several keys from different
# Google Cloud projects, comma-separated). One key covers about 95 subjects a day; the run resumes
# from cache, so re-run it the next day until REPORT.md shows no "pending" subjects.
name: Lectures

on:
  workflow_dispatch:
  push:
    branches: [feat/rgpv-all-branches-v2]
    paths:
      - scripts/lectures/fetch_youtube_lectures.mjs
      - scripts/lectures/config.json
      - scripts/lectures/found.json
      - scripts/lectures/build_from_found.mjs
      - .github/workflows/lectures.yml

permissions:
  contents: write

concurrency:
  group: lectures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    if: github.ref == 'refs/heads/feat/rgpv-all-branches-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (every topic has a lecture; fetcher against a mock API)
        run: node --test scripts/lectures/fetch_youtube_lectures.test.mjs
      - name: Check for an API key
        id: key
        env:
          KEY1: ${{ secrets.YOUTUBE_API_KEY }}
          KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
        run: |
          if [ -z "$KEY1$KEYS" ]; then
            echo "::notice::No YOUTUBE_API_KEY secret, so the optional API fetch is skipped. The site already uses scripts/lectures/found.json."
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch lectures
        if: steps.key.outputs.has == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
        run: node scripts/lectures/fetch_youtube_lectures.mjs
      - name: Coverage report
        if: steps.key.outputs.has == 'true'
        run: cat scripts/lectures/REPORT-api.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to this branch
        if: steps.key.outputs.has == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lectures/api-results.js scripts/lectures/REPORT-api.md scripts/lectures/cache.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "lectures: update YouTube lecture library"
          git push origin HEAD:feat/rgpv-all-branches-v2
