name: Play Store bundle (AAB)

# Builds the signed Android App Bundle that Google Play requires.
# Run it manually from the Actions tab once the signing secrets are set
# (see docs/play-store/README.md). Download the .aab from the run's artifacts
# and upload it to Play Console (closed testing first, then production).
on:
  workflow_dispatch:

jobs:
  bundle:
    name: Signed release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle offline copy of the site into the app
        run: node scripts/bundle-android-site.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.3'

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Follow docs/play-store/README.md to create the upload key."
            exit 1
          fi

      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: academy-lms-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
