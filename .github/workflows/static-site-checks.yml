name: Static Site Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validation tools
        run: npm install --global htmlhint prettier

      - name: Validate HTML
        run: find . -name "*.html" -not -path "./.git/*" -print0 | xargs -0 -n1 htmlhint --config .htmlhintrc

      - name: Validate JavaScript syntax
        run: find js -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Check formatting
        run: prettier --check "**/*.{html,css,js,md,yml,yaml,json}"
