name: Organize Resource Uploads

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Organize incoming resources and rebuild manifest
        run: node scripts/organize_resources.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/resources js/resource-library.js incoming_resources
          if git diff --cached --quiet; then
            echo "No resource changes to commit."
          else
            git commit -m "Organize uploaded study resources"
            git push
          fi
