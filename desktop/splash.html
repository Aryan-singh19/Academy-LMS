<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Academy LMS</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .card {
    position: absolute; inset: 10px; border-radius: 22px; overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #1b2150 0%, #0b0f19 70%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(139, 92, 246, .25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: card-in .5s ease-out both;
  }
  .halo {
    position: absolute; width: 260px; height: 260px; border-radius: 50%; top: 50%; left: 50%;
    transform: translate(-50%, -62%);
    background: radial-gradient(circle, rgba(34, 211, 238, .35) 0%, rgba(139, 92, 246, .18) 45%, transparent 70%);
    animation: halo 2.4s ease-in-out .6s infinite;
    opacity: 0;
  }
  .logo {
    width: 150px; height: 150px; position: relative;
    filter: drop-shadow(0 0 18px rgba(99, 102, 241, .65));
    animation: logo-in .9s cubic-bezier(.34, 1.56, .64, 1) .15s both, float 3s ease-in-out 1.1s infinite;
  }
  h1 {
    margin: 18px 0 0; color: #fff; font-size: 34px; font-weight: 700; letter-spacing: .5px;
    text-shadow: 0 0 18px rgba(139, 92, 246, .7);
    animation: rise .6s ease-out .55s both;
  }
  h1 span {
    background: linear-gradient(90deg, #22d3ee, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 6px 0 0; color: #94a3b8; font-size: 13px; animation: rise .6s ease-out .8s both; }
  .track { margin-top: 26px; width: 170px; height: 3px; border-radius: 3px; background: #1e293b; overflow: hidden; animation: rise .5s ease-out 1s both; }
  .bar { height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #22d3ee, #8b5cf6); animation: sweep 1.2s ease-in-out 1s infinite; }
  .status { margin-top: 10px; font-size: 11px; color: #64748b; animation: rise .5s ease-out 1.1s both; }
  @keyframes card-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes logo-in { from { opacity: 0; transform: scale(.5) rotate(-10deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes halo { 0%, 100% { opacity: .45; transform: translate(-50%, -62%) scale(.9); } 50% { opacity: 1; transform: translate(-50%, -62%) scale(1.08); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <div class="card">
    <div class="halo"></div>
    <img class="logo" src="splash-logo.png" alt="">
    <h1>Academy <span>LMS</span></h1>
    <p>RGPV B.Tech &amp; M.Tech &middot; Every branch, every semester</p>
    <div class="track"><div class="bar"></div></div>
    <div class="status">Loading your study desk&hellip;</div>
  </div>
</body>
</html>
